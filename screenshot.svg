<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="820" height="280" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="8" y="8" width="804" height="264" rx="18" fill="#FFFFFF" stroke="#E7EBEF" stroke-width="1.5"/>
  <text x="40" y="44" font-size="15" font-weight="700" letter-spacing="0.12em" fill="#2C4A6E">SEQUENCE</text>
  <text x="40" y="66" font-size="13.5" fill="#6B7B7B">A procedure one step at a time — the whole path stays visible.</text>

  <g>
    <line x1="52" y1="104" x2="128" y2="104" stroke="#C3CDD7" stroke-width="2"/>
    <line x1="142" y1="104" x2="222" y2="104" stroke="#C3CDD7" stroke-width="2"/>
    <line x1="240" y1="104" x2="320" y2="104" stroke="#E7EBEF" stroke-width="2"/>
    <line x1="334" y1="104" x2="414" y2="104" stroke="#E7EBEF" stroke-width="2"/>
    <line x1="428" y1="104" x2="508" y2="104" stroke="#E7EBEF" stroke-width="2"/>
    <line x1="522" y1="104" x2="602" y2="104" stroke="#E7EBEF" stroke-width="2"/>
    <line x1="616" y1="104" x2="696" y2="104" stroke="#E7EBEF" stroke-width="2"/>
    <line x1="710" y1="104" x2="768" y2="104" stroke="#E7EBEF" stroke-width="2"/>

    <circle cx="42" cy="104" r="10" fill="#C3CDD7"/>
    <text x="42" y="108" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="135" cy="104" r="10" fill="#C3CDD7"/>
    <text x="135" y="108" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <circle cx="231" cy="104" r="13" fill="#2C4A6E"/>
    <text x="231" y="109" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <circle cx="327" cy="104" r="10" fill="#FFFFFF" stroke="#E7EBEF" stroke-width="2"/>
    <text x="327" y="108" font-size="10" font-weight="700" fill="#BDC7D1" text-anchor="middle">4</text>
    <circle cx="421" cy="104" r="10" fill="#FFFFFF" stroke="#E7EBEF" stroke-width="2"/>
    <text x="421" y="108" font-size="10" font-weight="700" fill="#BDC7D1" text-anchor="middle">5</text>
    <circle cx="515" cy="104" r="10" fill="#FFFFFF" stroke="#E7EBEF" stroke-width="2"/>
    <text x="515" y="108" font-size="10" font-weight="700" fill="#BDC7D1" text-anchor="middle">6</text>
    <circle cx="609" cy="104" r="10" fill="#FFFFFF" stroke="#E7EBEF" stroke-width="2"/>
    <text x="609" y="108" font-size="10" font-weight="700" fill="#BDC7D1" text-anchor="middle">7</text>
    <circle cx="703" cy="104" r="10" fill="#FFFFFF" stroke="#E7EBEF" stroke-width="2"/>
    <text x="703" y="108" font-size="10" font-weight="700" fill="#BDC7D1" text-anchor="middle">8</text>
  </g>

  <text x="40" y="156" font-size="26" font-weight="800" fill="#0B1818">Open the set</text>
  <text x="40" y="188" font-size="16" fill="#22312f">Open the set aseptically and place the drape.</text>
  <rect x="432" y="174" width="34" height="20" rx="6" fill="#FFFFFF" stroke="#E7EBEF" stroke-width="1.5"/>
  <text x="449" y="190" font-size="16" font-weight="800" fill="#2C4A6E" text-anchor="middle">…</text>

  <rect x="40" y="206" width="2" height="24" fill="#2C4A6E"/>
  <text x="56" y="223" font-size="14.5" fill="#5A6A75">From here on: sterile away from the patient, unsterile near them.</text>

  <text x="40" y="256" font-size="11.5" font-weight="700" letter-spacing="0.08em" fill="#BDC7D1">ONE CLICK, ONE STEP — NATIVE REVEAL FRAGMENTS</text>
</svg>
